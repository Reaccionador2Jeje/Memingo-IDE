name: Memingo IDE packages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            command: npm run dist:win
            artifact: windows
          - platform: Linux
            os: ubuntu-latest
            command: npm run dist:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate source
        run: |
          npm run check
          npm test
      - name: Build desktop installers
        run: ${{ matrix.command }}
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: memingo-ide-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync mobile application
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: memingo-ide-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release-zip:
    name: Assemble all platform packages
    needs: [package, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Create release ZIP
        run: |
          mkdir -p release-bundle
          cp -R release-files/. release-bundle/
          cat > release-bundle/README.txt <<'EOF'
          Memingo IDE - paquetes multiplataforma

          memingo-ide-windows/: instaladores de Windows (NSIS)
          memingo-ide-linux/: paquetes Linux (AppImage y DEB)
          memingo-ide-android/: APK Android de depuración (no firmado para distribución)

          El APK de esta compilación es de prueba. Para publicar Android en tiendas,
          configura firma de release y revisa las capacidades móviles indicadas en el README.
          EOF
          cd release-bundle
          zip -r ../Memingo-IDE-release.zip .
      - name: Upload combined ZIP
        uses: actions/upload-artifact@v4
        with:
          name: memingo-ide-all-platforms
          path: Memingo-IDE-release.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Memingo-IDE-release.zip
          generate_release_notes: true
